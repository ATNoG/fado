apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-policy-watcher
rules:
  - apiGroups: ["security.ua.com"]
    resources: ["securitypolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-policy-sa-binding
subjects:
  - kind: ServiceAccount
    name: security-agent-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: security-policy-watcher
  apiGroup: rbac.authorization.k8s.io

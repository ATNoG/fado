apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: security-agent
  namespace: default
  labels:
    app: security-agent
spec:
  selector:
    matchLabels:
      app: security-agent
  template:
    metadata:
      labels:
        app: security-agent
    spec:
      serviceAccountName: security-agent-sa
      hostPID: true
      hostNetwork: true

      containers:
        - name: agent
          image: dev.local/security-agent:v1
          imagePullPolicy: Never

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          securityContext:
            privileged: false
            capabilities:
              drop:
                - ALL
              add:
                # allow the bpf syscall
                # TODO: i think this can be narrowed down
                - SYS_ADMIN

                # allow for eBPF resource allocation and memory locking (prevent swapping)
                - SYS_RESOURCE
                - IPC_LOCK

                # allow tracing/controlling other processes
                - SYS_PTRACE

          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: 1000m
              memory: 2048Mi

          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: container-sock
              mountPath: /run/containerd/containerd.sock
            - name: config
              mountPath: /etc/security-agent/mappings
              readOnly: true

      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: container-sock
          hostPath:
            path: /run/containerd/containerd.sock
        - name: config
          configMap:
            name: security-agent-config

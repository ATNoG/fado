apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: security-agent
  namespace: default
  labels:
    app: security-agent
spec:
  selector:
    matchLabels:
      app: security-agent
  template:
    metadata:
      labels:
        app: security-agent
    spec:
      serviceAccountName: security-agent-sa
      hostPID: true 
      hostNetwork: true

      tolerations:
        - operator: Exists
          effect: NoSchedule

      containers:
        - name: agent
          image: dev.local/security-agent:v1
          imagePullPolicy: Never

          securityContext:
            privileged: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_ADMIN
                - SYS_RESOURCE
                - SYS_PTRACE
                - DAC_OVERRIDE
                - IPC_LOCK

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: container-sock
              mountPath: /run/containerd/containerd.sock 

      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: container-sock
          hostPath:
            path: /run/containerd/containerd.sock

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securitypolicies.security.ua.com
spec:
  group: security.ua.com
  names:
    kind: SecurityPolicy
    plural: securitypolicies
    singular: securitypolicy
    shortNames:
      - sp
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - match
                - actions
              properties:
                match:
                  type: object
                  required:
                    - alert_severity
                  properties:
                    alert_severity:
                      type: string
                      enum: [low, medium, high] 
                actions:
                  type: array
                  minItems: 1 
                  items:
                    type: string
                    enum: [nothing, log, kill]

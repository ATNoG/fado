apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-policy-node-watcher
rules:
  - apiGroups: ["security.ua.com"]
    resources: ["securitypolicies"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-policy-node-binding
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: security-policy-node-watcher
  apiGroup: rbac.authorization.k8s.io
